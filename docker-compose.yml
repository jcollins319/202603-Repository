version: "3.9"

services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: insiderflow
      POSTGRES_PASSWORD: insiderflow
      POSTGRES_DB: insiderflow
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U insiderflow"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  api:
    build: ./backend
    ports:
      - "8000:8000"
    environment:
      DATABASE_URL: postgresql://insiderflow:insiderflow@db:5432/insiderflow
      REDIS_URL: redis://redis:6379/0
      SEC_USER_AGENT: "InsiderFlow admin@insiderflow.com"
      POLLING_INTERVAL_SECONDS: "300"
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped

  frontend:
    build: ./frontend
    ports:
      - "3000:3000"
    environment:
      NEXT_PUBLIC_API_URL: http://api:8000/api
    depends_on:
      - api
    restart: unless-stopped

volumes:
  pgdata:
